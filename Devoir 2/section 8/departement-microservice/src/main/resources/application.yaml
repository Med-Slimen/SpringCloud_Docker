spring:
  profiles:
    active: "prod"
  config:
      import: "optional:configserver:http://localhost:9999/"
  application:
    name: departement
  datasource:
    url: 'jdbc:h2:mem:departementsdb'
  h2:
    console:
      enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  eureka:
    client:
      service-url:
        defaultZone: 'http://localhost:8761/eureka/'
management:
  endpoints:
    web:
      exposure:
        include: '*'
eureka:
  instance:
    prefer-ip-address: true
build:
  version : "1.0"
author:
  name: "Med Slimene"
  email: "medsm@gmail.com"