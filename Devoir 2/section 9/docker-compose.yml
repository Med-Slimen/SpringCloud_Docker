services:
  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
    ports:
      - "8761:8761"
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health | grep UP || exit 1"
      interval: 10s
  configserver:
    build: ./configserver
    container_name: configserver
    ports:
      - "9999:9999"
    healthcheck:
      test: "curl --fail --silent localhost:9999/actuator/health | grep UP || exit 1"
      interval: 10s
  departments-ms:
    build: ./departement-microservice
    container_name: departement
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eurekaserver:8761/eureka/
      - CONFIG_SERVICE_URL=http://configserver:9999
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health | grep UP || exit 1"
    depends_on:
      eurekaserver :
        condition: service_healthy
      configserver:
        condition: service_healthy
  departments-ms2:
    build: ./departement-microservice
    container_name: departement2
    ports:
      - "8081:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eurekaserver:8761/eureka/
      - CONFIG_SERVICE_URL=http://configserver:9999
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1"
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
  gatewayserver:
    build: ./gatewayserver
    container_name: gatewayserver
    ports:
      - "8888:8888"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
    depends_on:
      eurekaserver:
        condition: service_healthy
  projets-ms:
    build: ./projet-microservice
    container_name: projets-ms
    ports:
      - "8082:8081"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - CONFIG_SERVICE_URL=http://configserver:9999
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      departments-ms:
        condition: service_healthy