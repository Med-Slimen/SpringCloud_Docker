services:
  eurekaserver:
    build: ./eurekaserver
    container_name: eurekaserver
#    ports:
#      - "8761:8761"
    healthcheck:
      test: "curl --fail --silent localhost:8761/actuator/health | grep UP || exit 1"
      interval: 10s
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.4
    container_name: keycloak
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    ports:
      - "8090:8080"
  rabbitmq:
    image: rabbitmq:4.0-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  configserver:
    build: ./configserver
    container_name: configserver
#    ports:
#      - "9999:9999"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:9999/actuator/health | grep UP || exit 1"
      interval: 10s
      start_period: 20s

  departments-ms:
    build: ./departement-microservice
    container_name: departement
#    ports:
#      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eurekaserver:8761/eureka/
      - CONFIG_SERVICE_URL=http://configserver:9999
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health | grep UP || exit 1"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
  #departments-ms2:
    #build: ./departement-microservice
    #container_name: departement2
    #ports:
     # - "8081:8080"
    #environment:
     # - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eurekaserver:8761/eureka/
      #- CONFIG_SERVICE_URL=http://configserver:9999
    #healthcheck:
     # test: "curl --fail --silent localhost:8081/actuator/health | grep UP || exit 1"
    #depends_on:
     # eurekaserver:
      #  condition: service_healthy
      #configserver:
       # condition: service_healthy
  gatewayserver:
    build: ./gatewayserver
    container_name: gatewayserver
    ports:
      - "8888:8888"
    environment:
      - DISCOVERY_SERVICE_URL=http://eurekaserver:8761/eureka
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/master/protocol/openid-connect/certs
    depends_on:
      eurekaserver:
        condition: service_healthy
      keycloak:
        condition: service_started

  projets-ms:
    build: ./projet-microservice
    container_name: projets-ms
#    ports:
#      - "8082:8081"
    environment:
      - JAVA_TOOL_OPTIONS=-Deureka.client.serviceUrl.defaultZone=http://eurekaserver:8761/eureka/
      - CONFIG_SERVICE_URL=http://configserver:9999
      - SPRING_RABBITMQ_HOST=host.docker.internal
      - SPRING_RABBITMQ_PORT=5672
    depends_on:
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      departments-ms:
        condition: service_healthy