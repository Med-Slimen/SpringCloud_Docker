server:
  port: 8888

spring:
  application:
    name: gatewayserver

  security:
    oauth2:
      resourceserver:
        jwt:
          # Ensure this is exactly at this indentation level
          jwk-set-uri: "http://localhost:8090/realms/master/protocol/openid-connect/certs"

  config:
    import: "optional:configserver:"

  cloud:
    config:
      enabled: false

    discovery:
      enabled: true

    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
              lower-case-service-id: true

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    gateway:
      access: unrestricted

eureka:
  client:
    register-with-eureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: ${DISCOVERY_SERVICE_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 10s # Keep this as 10s based on our previous fix!